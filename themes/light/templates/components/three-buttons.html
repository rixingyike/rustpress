{% set_global show_comments = true %}
{% if page is defined %}
  {% if page.comments is defined and page.comments == false %}
    {% set_global show_comments = false %}
  {% endif %}
{% endif %}
<div class="flex items-center justify-center gap-6 py-6 my-8 select-none">
  {% if show_comments %}
  <button onclick="document.getElementById('rp-comments') && document.getElementById('rp-comments').scrollIntoView({behavior:'smooth'})" class="flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-mist-green hover:text-moss-ink bg-flat-white border border-sage-line/20 hover:border-cyber-mint transition-colors cursor-pointer">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    <span>评论</span>
    <span id="rp-comment-count" class="text-xs text-gray-400">0</span>
  </button>
  {% endif %}

  <button id="rp-like-btn" onclick="rpToggleLike()" data-liked="false" class="flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-mist-green border border-sage-line/20 bg-flat-white hover:text-blue-600 hover:border-blue-300 transition-colors cursor-pointer">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
    <span>点赞</span>
    <span id="rp-like-count" class="text-xs text-gray-400">0</span>
  </button>
  <button onclick="rpBookmark()" class="flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-mist-green border border-sage-line/20 bg-flat-white hover:text-amber-500 hover:border-amber-300 transition-colors cursor-pointer">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.252.587 1.813l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.97-2.883a1 1 0 00-1.17 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118l-3.97-2.883c-.773-.56-.375-1.813.587-1.813h4.906a1 1 0 00.95-.69l1.519-4.674z"/></svg>
    <span>收藏</span>
  </button>
</div>
