<section id="rp-comments" style="margin-top: 3rem;">
    <h4 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; color: #111827;">评论</h4>

    <!-- 评论列表 -->
    <div id="rp-comments-list"></div>
    <div id="rp-comments-status" style="font-size: 0.875rem; color: #6b7280; padding: 1rem 0; text-align: center;">
        加载评论中...</div>

    <!-- 评论输入区 -->
    <div id="rp-comment-form" style="margin-top: 1.5rem; display: none;">
        <!-- 登录用户信息 -->
        <div id="rp-user-info"
            style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; color: #374151;">
            <img id="rp-user-avatar" src="" alt="" style="width: 28px; height: 28px; border-radius: 50%;">
            <span id="rp-user-name" style="font-weight: 600;"></span>
            <a href="#" id="rp-logout-btn"
                style="margin-left: auto; font-size: 12px; color: #9ca3af; text-decoration: underline;"
                onclick="rpLogout(); return false;">退出</a>
        </div>
        <!-- 输入框 -->
        <textarea id="rp-comment-input"
            style="width: 100%; min-height: 100px; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; line-height: 1.6; resize: vertical; font-family: inherit; box-sizing: border-box;"
            placeholder="写下你的评论（支持 Markdown）..."></textarea>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button id="rp-submit-btn" onclick="rpSubmitComment()"
                style="padding: 8px 20px; font-size: 0.875rem; font-weight: 500; color: #fff; background-color: #2563eb; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s;"
                onmouseover="this.style.backgroundColor='#1d4ed8'" onmouseout="this.style.backgroundColor='#2563eb'">
                发表评论
            </button>
        </div>
        <div id="rp-submit-status" style="font-size: 13px; color: #6b7280; margin-top: 6px; text-align: right;">
        </div>
    </div>

    <!-- 未登录时显示登录按钮 -->
    <div id="rp-login-section" style="margin-top: 1.5rem; text-align: center; display: none;">
        <p style="font-size: 14px; color: #6b7280; margin-bottom: 12px;">登录 GitHub 后即可发表评论</p>
        <a id="rp-login-btn" href="#"
            style="display: inline-flex; align-items: center; padding: 10px 20px; font-size: 0.875rem; font-weight: 500; color: #fff; background-color: #1f2937; border-radius: 6px; text-decoration: none; transition: background-color 0.2s;"
            onmouseover="this.style.backgroundColor='#374151'" onmouseout="this.style.backgroundColor='#1f2937'">
            <svg style="width: 18px; height: 18px; margin-right: 8px;" fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
            使用 GitHub 登录
        </a>
    </div>
</section>

<style>
    .rp-comment {
        border-bottom: 1px solid #e5e7eb;
        padding: 16px 0;
    }

    .rp-comment:last-child {
        border-bottom: none;
    }

    .rp-comment-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
    }

    .rp-comment-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
    }

    .rp-comment-author {
        font-weight: 600;
        color: #111827;
        font-size: 14px;
    }

    .rp-comment-date {
        color: #9ca3af;
        font-size: 12px;
    }

    .rp-comment-body {
        color: #374151;
        font-size: 14px;
        line-height: 1.6;
    }

    .rp-comment-body p {
        margin: 6px 0;
    }

    .rp-comment-body code {
        background: #f3f4f6;
        padding: 2px 5px;
        border-radius: 3px;
        font-size: 13px;
    }

    .rp-comment-body pre {
        background: #1f2937;
        color: #e5e7eb;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
    }

    .rp-comment-body pre code {
        background: none;
        padding: 0;
        color: inherit;
    }

    .rp-comment-body blockquote {
        border-left: 3px solid #d1d5db;
        padding-left: 12px;
        color: #6b7280;
        margin: 8px 0;
    }

    .rp-comment-body img {
        max-width: 100%;
        border-radius: 6px;
        margin: 8px 0;
    }

    .rp-comment-body a {
        color: #2563eb;
        text-decoration: underline;
    }

    .rp-no-comments {
        text-align: center;
        color: #9ca3af;
        padding: 24px 0;
    }

    .rp-comment-count {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 12px;
    }
</style>

<script>
    // ---- 全局状态 ----
    var RP_REPO = '{{REPO}}';
    var RP_CLIENT_ID = '{{CLIENT_ID}}';
    var rpCurrentIssueNumber = null;

    // ---- 工具函数 ----
    function getCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) == ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    // ---- Markdown 转 HTML (Simple) ----
    function rpMd2html(text) {
        if (!text) return '';
        var h = text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/```([\s\S]*?)```/g, function (m, c) { return '<pre><code>' + c.trim() + '</code></pre>'; })
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
            .replace(/\n/g, '<br>');
        h = h.replace(/<\/blockquote><br><blockquote>/g, '<br>');
        return h;
    }

    function rpFormatDate(dateStr) {
        var d = new Date(dateStr);
        return d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0') + ' ' +
            String(d.getHours()).padStart(2, '0') + ':' +
            String(d.getMinutes()).padStart(2, '0');
    }

    // ---- 渲染评论列表 ----
    function rpRenderComments(comments) {
        var container = document.getElementById('rp-comments-list');
        if (comments.length === 0) {
            container.innerHTML = '<div class="rp-no-comments">暂无评论，成为第一个评论者吧！</div>';
        } else {
            container.innerHTML = '<div class="rp-comment-count">共 ' + comments.length + ' 条评论</div>' +
                comments.map(function (c) {
                    return '<div class="rp-comment">' +
                        '<div class="rp-comment-header">' +
                        '<img class="rp-comment-avatar" src="' + c.user.avatar_url + '" alt="' + c.user.login + '">' +
                        '<span class="rp-comment-author">' + c.user.login + '</span>' +
                        '<span class="rp-comment-date">' + rpFormatDate(c.created_at) + '</span>' +
                        '</div>' +
                        '<div class="rp-comment-body">' + rpMd2html(c.body) + '</div>' +
                        '</div>';
                }).join('');
        }
    }

    // ---- 加载评论 ----
    function rpLoadComments() {
        var status = document.getElementById('rp-comments-status');
        var pathname = window.location.pathname;

        var searchUrl = 'https://api.github.com/search/issues?q=' +
            encodeURIComponent(pathname + ' repo:' + RP_REPO + ' is:issue') +
            '&sort=created&order=desc&per_page=1';

        fetch(searchUrl, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
        })
            .then(function (r) {
                if (r.status === 403) throw new Error('rate_limit');
                return r.json();
            })
            .then(function (data) {
                if (!data.items || data.items.length === 0) {
                    rpRenderComments([]);
                    rpCurrentIssueNumber = null;
                    status.style.display = 'none';
                    return;
                }
                var issue = data.items[0];
                rpCurrentIssueNumber = issue.number;

                return fetch(issue.comments_url + '?per_page=100', {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                })
                    .then(function (r) { return r.json(); })
                    .then(function (comments) {
                        rpRenderComments(comments);
                        status.style.display = 'none';
                    });
            })
            .catch(function (err) {
                if (err.message === 'rate_limit') {
                    status.textContent = 'GitHub API 请求次数超限，请稍后再试';
                } else {
                    console.error(err);
                    status.textContent = '评论加载失败';
                }
            });
    }

    // ---- 检查登录状态 (Static Method) ----
    function rpCheckLogin() {
        if (!RP_CLIENT_ID) return;

        // Check for token in URL (from Worker redirect)
        var urlParams = new URLSearchParams(window.location.search);
        var tokenFromUrl = urlParams.get('gh_token') || urlParams.get('access_token');
        if (tokenFromUrl) {
            document.cookie = "gh_token=" + tokenFromUrl + "; path=/; max-age=2592000"; // 30 days
            // Clean URL
            var newUrl = window.location.pathname + window.location.hash;
            window.history.replaceState({}, document.title, newUrl);
        }

        var token = getCookie('gh_token');
        if (token) {
            // Verify token by fetching user
            fetch('https://api.github.com/user', {
                headers: { 'Authorization': 'token ' + token }
            })
                .then(r => {
                    if (r.ok) return r.json();
                    throw new Error('Invalid token');
                })
                .then(data => {
                    document.getElementById('rp-comment-form').style.display = 'block';
                    document.getElementById('rp-login-section').style.display = 'none';
                    document.getElementById('rp-user-avatar').src = data.avatar_url;
                    document.getElementById('rp-user-name').textContent = data.name || data.login;
                })
                .catch(e => {
                    document.cookie = 'gh_token=; path=/; max-age=0'; // Clear invalid token
                    rpShowLoginButton();
                });
        } else {
            rpShowLoginButton();
        }
    }

    function rpShowLoginButton() {
        document.getElementById('rp-comment-form').style.display = 'none';
        document.getElementById('rp-login-section').style.display = 'block';

        // Use Worker as redirect target
        // The Worker will redirect back to this page (state)
        // Note: You must updating GitHub App Callback URL to your Worker URL
        // e.g. https://oauth.yishulun.workers.dev/callback

        // We assume user configured the worker. 
        // If not, we fallback to direct GitHub flow (which fails on static).
        // For now we assume the user will configure the GitHub App callback 
        // to point to the WORKER.
        // The redirect_uri param here MUST MATCH the one registered in GitHub App.
        // If user set GitHub App Callback = https://oauth.yishulun.workers.dev/callback
        // Then we must use that here.
        // But we don't know the worker URL here!

        // Wait, if we use a Worker, we should link to the Worker's /login endpoint? 
        // Or simply link to GitHub with redirect_uri = Worker URL?

        // If we link to standard GitHub Authorize, we need to pass redirect_uri.
        // If we don't pass redirect_uri, GitHub uses the default registered one.
        // THIS IS THE KEY. We don't need to hardcode the worker URL if it's the default!

        var loginUrl = 'https://github.com/login/oauth/authorize?client_id=' +
            '&client_id=' + RP_CLIENT_ID +
            // ⚠️ 警告：
            // 如果您的 GitHub App 配置了 Authorization callback URL 为 Worker 地址，
            // 那么这里建议 **不传递** redirect_uri 参数，让 GitHub 使用默认配置。
            // 
            // 如果由于某种原因 GitHub 报错，您可以取消下面这行的注释，并填入您的 Worker 地址：
            // '&redirect_uri=' + encodeURIComponent('https://<您的-worker-名>.<您的-subdomain>.workers.dev/callback') +
            '&state=' + encodeURIComponent(window.location.pathname) + // Worker uses this to redirect back
            '&scope=public_repo';

        document.getElementById('rp-login-btn').href = loginUrl;
    }

    // ---- 提交评论 (Static Method) ----
    function rpSubmitComment() {
        var input = document.getElementById('rp-comment-input');
        var submitBtn = document.getElementById('rp-submit-btn');
        var submitStatus = document.getElementById('rp-submit-status');
        var body = input.value.trim();
        var token = getCookie('gh_token');

        if (!token) {
            rpCheckLogin();
            return;
        }

        if (!body) {
            submitStatus.textContent = '请输入评论内容';
            submitStatus.style.color = '#ef4444';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';
        submitStatus.textContent = '发送中...';
        submitStatus.style.color = '#6b7280';

        // Helper to post comment
        function doPostLink(issueNumber) {
            fetch('https://api.github.com/repos/' + RP_REPO + '/issues/' + issueNumber + '/comments', {
                method: 'POST',
                headers: {
                    'Authorization': 'token ' + token,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({ body: body })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.id) {
                        input.value = '';
                        submitStatus.textContent = '✓ 评论已发表';
                        submitStatus.style.color = '#16a34a';
                        setTimeout(function () {
                            rpLoadCommentsByIssue(issueNumber);
                        }, 1000);
                    } else {
                        throw new Error(data.message || 'Failed');
                    }
                })
                .catch(err => {
                    submitStatus.textContent = '发送失败: ' + err.message;
                    submitStatus.style.color = '#ef4444';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                });
        }

        // If issue doesn't exist, create it first
        if (!rpCurrentIssueNumber) {
            var title = (document.querySelector('h1') ? document.querySelector('h1').textContent.trim() : document.title);
            fetch('https://api.github.com/repos/' + RP_REPO + '/issues', {
                method: 'POST',
                headers: {
                    'Authorization': 'token ' + token,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    title: title + ' | ' + window.location.pathname,
                    body: 'Comment thread for ' + window.location.pathname + '\n\n' + window.location.href
                })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.number) {
                        rpCurrentIssueNumber = data.number;
                        doPostLink(rpCurrentIssueNumber);
                    } else {
                        throw new Error('无法创建 Issue: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(err => {
                    submitStatus.textContent = '初始化评论区失败: ' + err.message;
                    submitStatus.style.color = '#ef4444';
                    submitBtn.disabled = false;
                });
        } else {
            doPostLink(rpCurrentIssueNumber);
        }
    }

    // ---- 通过 Issue 编号直接加载评论 ----
    function rpLoadCommentsByIssue(issueNumber) {
        var url = 'https://api.github.com/repos/' + RP_REPO + '/issues/' + issueNumber + '/comments?per_page=100';
        fetch(url, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
        })
            .then(function (r) { return r.json(); })
            .then(function (comments) {
                rpRenderComments(comments);
            })
            .catch(function () {
                rpLoadComments();
            });
    }

    // ---- 退出登录 ----
    function rpLogout() {
        document.cookie = 'gh_token=; path=/; max-age=0';
        window.location.reload();
    }

    // ---- 初始化 ----
    rpLoadComments();
    rpCheckLogin();
</script>
